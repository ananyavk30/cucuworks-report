#stats{top:calc(10px + env(safe-area-inset-top,0px));right:10px;text-align:right;line-height:1.7}#stats b{font-size:17px;color:var(--cy)}

.d{display:inline-block;width:12px;height:12px;margin-right:8px;vertical-align:-1px}

@media(max-width:700px){#stats{top:auto;bottom:calc(10px + env(safe-area-inset-bottom,0px))}#leg{display:none}}

[-3,4.5].forEach(x=>{const t=new THREE.Mesh(new THREE.TorusGeometry(1.3,.11,10,40),mat(OR));t.rotation.y=Math.PI/2;t.position.x=x;C.add(t)});

 for(let i=0;i<28;i++){const r=Math.random(),ty=r<.4?'s':r<.7?'f':'n',m=new THREE.Mesh(ty==='s'?gS:ty==='f'?gF:gN,ty==='s'?mS:ty==='f'?mF:mN);

  if(g<.55){rc=Math.sin(g/.55*s)}else if(g<.95){rc=1-.5*((g-.55)/.4);cl=Math.sin((g-.55)/.4*s)}

let done=0;
// stages

// input
const ray=new THREE.Raycaster(),pl=new THREE.Plane(),v=new THREE.Vector3();

// ocean scene

const cukes=[{x:150,th:.2},{x:430,th:.5},{x:600,th:.8}];

function coral(c,gr){const s=(.3+.7*gr)*c.s,col=gr>0?`hsl(${c.hue},${75*gr}%,${mix(78,55,gr)}%)`:'hsl(0,0%,72%)',x=c.x,y=374;

 fish.forEach((f,i)=>{const v=i===0?1:Math.min(1,Math.max(0,(h-f.th)*8));if(v<=0)return;
  const L=OW+100,x=(((f.x+f.sp*t)%L)+L)%L-50,y=f.y+Math.sin(t*2+f.ph)*8,d=f.sp>0?1:-1,z=f.sz;
